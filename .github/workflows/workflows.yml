name: Workflows
on: [push]
jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - uses: ruby/setup-ruby@cb0fda56a307b8c78d38320cd40d9eb22a3bf04e # v1.242.0
      with:
        bundler-cache: true
    - run: bundle exec rake rubocop
  specs:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest] # crabstone isn't compatible with capstone v5 on macOS
        os: [ubuntu-latest]
        ruby: ['2.7', '3.0', '3.1', '3.2', 'truffleruby']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - uses: ruby/setup-ruby@cb0fda56a307b8c78d38320cd40d9eb22a3bf04e # v1.242.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        bundler: latest
    - run: if [[ $(uname) == "Darwin" ]]; then brew install capstone; else sudo apt-get install libcapstone4; fi
    - run: bundle exec rake specs
  specs-no-dependencies:
    strategy:
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.3']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - uses: ruby/setup-ruby@cb0fda56a307b8c78d38320cd40d9eb22a3bf04e # v1.242.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - env:
        NO_DEPENDENCIES_INSTALLED: true
      run: bundle exec rake specs
